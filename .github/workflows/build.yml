name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The build has no runtime dependency on the database, so no SQL Server service is started.
      - name: Build all examples
        run: ./build-all.sh
